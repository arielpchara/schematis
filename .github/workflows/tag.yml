name: Tag

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --tags origin "refs/tags/v${VERSION}" | grep -q .
          then
            echo "v${VERSION} already exists"
            exit 0
          fi
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          gh workflow run Publish --ref "v${VERSION}"
